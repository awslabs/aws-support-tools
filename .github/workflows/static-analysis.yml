name: Static analysis

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.12.0

      # This is vendored upstream code; leave it unchanged so it can be refreshed cleanly. See #285.
      - name: Check shell scripts
        run: find . -type f -name '*.sh' -not -path './.git/*' -not -path './OpsWorks/sample-cookbooks/cpulimit-ruby/files/default/cpulimit-master/*' -size +0c -print0 | xargs -0 shellcheck -S warning

      - name: Check Python syntax and undefined names
        run: git ls-files -z -- '*.py' ':(exclude)OpsWorks/sample-cookbooks/cpulimit-ruby/files/default/cpulimit-master/**' | xargs -0 ruff check --select E9,F63,F7,F82
